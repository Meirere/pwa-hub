<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Perícia Criminal</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#8b0000">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 620px;
  padding: 24px;
  text-align: center;
  box-sizing: border-box;
}

.logo {
  width: 150px;
  height: 150px;
  object-fit: contain;
  margin: 10px auto 30px;
  display: block;
  border-radius: 12px;
}

h1 {
  font-size: 2.6rem;
  margin: 0 0 12px;
}

.subtitulo {
  color: #cfcfcf;
  font-size: 1.15rem;
  margin-bottom: 34px;
}

.modulo {
  display: block;
  width: 100%;
  padding: 26px 22px;
  margin: 18px 0;
  border-radius: 18px;
  color: white;
  text-align: center;
  font-size: 1.35rem;
  font-weight: 700;
  text-decoration: none;
  letter-spacing: 0.3px;
  box-shadow: 0 8px 18px rgba(0,0,0,0.35);
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  box-sizing: border-box;
}

.modulo:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(0,0,0,0.45);
  filter: brightness(1.08);
}

.modulo:active {
  transform: scale(0.98);
}
    
.transito {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
}

.mvi {
  background: linear-gradient(135deg, #dc2626, #991b1b);
}

.suicidio {
  background: linear-gradient(135deg, #16a34a, #166534);
}

.balistica {
  background: linear-gradient(135deg, #374151, #111827);
}

.frenagem {
  background: linear-gradient(135deg, #e57373, #790404);
}
    
footer{
    margin-top:40px;
    color:#888;
    font-size:12px;
}

</style>
</head>

<body>

<div class="container">

<img src="icon.png" class="logo">

<h1>Perícia Criminal</h1>

<div class="subtitulo">
Central de acesso aos módulos periciais
</div>

<a class="modulo transito" href="https://meirere.github.io/pwa-transito/">Perícia de Trânsito</a>
<a class="modulo mvi" href="https://meirere.github.io/pwa-mvi/">Morte Violenta Intencional</a>
<a class="modulo suicidio" href="https://meirere.github.io/pwa-suicidio/">Perícia de Suicídio</a>
<a class="modulo balistica" href="https://meirere.github.io/pwa-balistica/">Calculadora Balística</a>
<a class="modulo frenagem" href="https://meirere.github.io/pwa-frenagem/">Velocidade pela Marca de Frenagem</a>
    
<footer>
© Perito Meirere
</footer>

</div>

<script>

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

</script>

</body>
</html>
